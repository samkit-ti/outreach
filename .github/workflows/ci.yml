name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff linter
      run: ruff check skills/ scripts/ sql/

    - name: Run Ruff formatter check
      run: ruff format --check skills/ scripts/ sql/

    - name: Run MyPy type checker
      run: mypy skills/ --ignore-missing-imports

    - name: Run tests
      run: pytest tests/ -v --cov=skills --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './scripts'
        severity: warning

  validate-configs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Validate JSON files
      run: |
        for file in beads/formulas/*.json; do
          echo "Validating $file"
          python -m json.tool "$file" > /dev/null
        done

    - name: Validate YAML files
      run: |
        pip install pyyaml
        python -c "
        import yaml
        import sys
        from pathlib import Path
        for f in Path('config').glob('*.yaml'):
            print(f'Validating {f}')
            yaml.safe_load(f.read_text())
        "

    - name: Check shell scripts are executable
      run: |
        for script in scripts/*.sh; do
          if [ ! -x "$script" ]; then
            echo "ERROR: $script is not executable"
            exit 1
          fi
        done
        echo "All shell scripts are executable"
