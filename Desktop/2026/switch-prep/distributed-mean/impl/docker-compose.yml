name: distributed-mean

x-shared-env: &shared-env
  DATABASE_URL: postgres://dm:dm@postgres:5432/dm
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: dmadmin
  S3_SECRET_KEY: dmsecret
  S3_BUCKET: distributed-mean
  S3_FORCE_PATH_STYLE: "true"
  INPUT_URI_ALLOWLIST: "s3://distributed-mean/"
  K_FANIN: "5"
  LEASE_SECONDS: "30"
  HEARTBEAT_SECONDS: "10"
  REAPER_SECONDS: "5"
  TASK_DEADLINE_SECONDS: "300"
  MAX_ATTEMPTS: "3"
  IDLE_POLL_MS: "500"
  MAX_ACTIVE_JOBS: "8"
  MAX_JOB_BYTES: "5368709120"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: dm
      POSTGRES_DB: dm
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm -d dm"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dmadmin
      MINIO_ROOT_PASSWORD: dmsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dmadmin dmsecret &&
      mc mb --ignore-existing local/distributed-mean &&
      echo bucket-ready"

  api:
    build: ./api
    environment:
      <<: *shared-env
      PORT: "8080"
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build: ./worker
    labels:
      dm.role: worker
    environment:
      <<: *shared-env
      SPEED_FACTOR: "${SPEED_FACTOR:-1.0}"
    depends_on:
      api:
        condition: service_started
    stop_grace_period: 120s

  supervisor:
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    environment:
      <<: *shared-env
      DM_PROJECT: distributed-mean
      WORKER_IMAGE: distributed-mean-worker
      WORKER_NETWORK: distributed-mean_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # demo-only; see HLD §9
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: nginx:alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
