[project]
name = "distributed-mean-worker"
version = "1.0.0"
description = "Pull-based worker: map/reduce/finalize over (sum, count) partials"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dm-worker = "worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
