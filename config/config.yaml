# Outreach Agent Configuration
# Values wrapped in ${ENV_VAR} are substituted at runtime from environment variables
# or from HERMES_HOME/.env (loaded by python-dotenv if available).

model:
  provider: azure-foundry
  # Azure AI Foundry endpoint — set AZURE_FOUNDRY_ENDPOINT env var
  base_url: ${AZURE_FOUNDRY_ENDPOINT:-https://ps3labs.openai.azure.com/openai/v1}
  api_mode: chat_completions
  auth_mode: entra_id
  default: ${DEFAULT_MODEL:-kimi-k2-6}
  context_length: 200000
  entra:
    scope: https://ai.azure.com/.default

# Alternative: use api_key mode instead of entra_id
#   auth_mode: api_key
#   api_key: ${AZURE_OPENAI_API_KEY}

gateway:
  platforms:
    email:
      poll_interval: 15
      allowed_users:
        - "${FOUNDER_EMAIL:-samkit@ps3labs.ai}"
      home_address: "${FOUNDER_EMAIL:-samkit@ps3labs.ai}"
    
    whatsapp:
      mode: bot
      allowed_users: "*"
      unauthorized_dm_behavior: ignore
      reply_prefix: ""
    
    discord:
      token_env: DISCORD_BOT_TOKEN
      allowed_users:
        - "${FOUNDER_DISCORD_ID}"
      dm_only: true

display:
  tool_progress: new
  busy_ack_enabled: true
  busy_ack_detail: false
  platforms:
    telegram:
      tool_progress: off
      busy_ack_detail: false
    discord:
      tool_progress: all
      busy_ack_detail: true

cron:
  jobs:
    - name: follow_up_scheduler
      schedule: "0 9 * * *"
      command: "python -m skills.follow_up_scheduler"
    
    - name: pattern_extractor
      schedule: "0 10 * * 1"
      command: "python -m skills.pattern_extractor"
    
    - name: market_research
      schedule: "0 11 * * 1"
      command: "python -m skills.market_research"
    
    - name: git_sync
      schedule: "0 2 * * *"
      command: "bash /app/scripts/git-sync.sh"

# Custom tool paths
skills:
  paths:
    - /app/skills
    - /app/active-skills
