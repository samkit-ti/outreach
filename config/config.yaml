# Outreach Agent Configuration
# Values wrapped in ${ENV_VAR} are substituted at runtime from environment variables
# or from HERMES_HOME/.env (loaded by python-dotenv if available).

model:
  provider: azure-foundry
  # Azure AI Foundry endpoint — Kimi K2.6 via opencode-agent-resource
  base_url: ${AZURE_FOUNDRY_BASE_URL:-https://opencode-agent-resource.services.ai.azure.com/models}
  api_mode: chat_completions
  auth_mode: api_key
  default: ${DEFAULT_MODEL:-Kimi-K2.6}
  context_length: 128000
  api_key: ${AZURE_FOUNDRY_API_KEY}

# Alternative: use Azure OpenAI direct
#   provider: openai
#   base_url: ${AZURE_OPENAI_ENDPOINT}
#   api_key: ${AZURE_OPENAI_API_KEY}

gateway:
  platforms:
    telegram:
      token_env: TELEGRAM_BOT_TOKEN
      allowed_users: "*"
      unauthorized_dm_behavior: ignore
      reply_to_mode: first
      reply_prefix: ""
      
    email:
      poll_interval: 15
      allowed_users:
        - "${FOUNDER_EMAIL:-samkit@ps3labs.ai}"
      home_address: "${FOUNDER_EMAIL:-samkit@ps3labs.ai}"
    
    whatsapp:
      mode: bot
      allowed_users: "*"
      unauthorized_dm_behavior: ignore
      reply_prefix: ""
    
    discord:
      token_env: DISCORD_BOT_TOKEN
      allowed_users:
        - "${FOUNDER_DISCORD_ID}"
      dm_only: true

display:
  tool_progress: new
  busy_ack_enabled: true
  busy_ack_detail: false
  platforms:
    telegram:
      tool_progress: off
      busy_ack_detail: false
    discord:
      tool_progress: all
      busy_ack_detail: true

cron:
  jobs:
    - name: daily_follow_up
      schedule: "0 9 * * *"
      command: "python -m skills.follow_up_scheduler"
    
    - name: weekly_pattern_analysis
      schedule: "0 10 * * 1"
      command: "python -m skills.pattern_extractor"
    
    - name: weekly_market_research
      schedule: "0 11 * * 1"
      command: "python -m skills.market_research"
    
    - name: git_sync
      schedule: "0 2 * * *"
      command: "bash /app/scripts/git-sync.sh"

# Custom tool paths
skills:
  paths:
    - /app/skills
    - /app/active-skills

# Web search configuration
web:
  backend: ${WEB_SEARCH_BACKEND:-duckduckgo}
  search_backend: ${WEB_SEARCH_BACKEND:-duckduckgo}

# Auxiliary models for specialized tasks
auxiliary:
  vision:
    provider: azure-foundry
    model: Kimi-K2.6
    base_url: ${AZURE_FOUNDRY_BASE_URL}
    api_key: ${AZURE_FOUNDRY_API_KEY}
  
  web_extract:
    provider: azure-foundry
    model: Kimi-K2.6
    base_url: ${AZURE_FOUNDRY_BASE_URL}
    api_key: ${AZURE_FOUNDRY_API_KEY}

# Sessions configuration
sessions:
  auto_prune: true
  retention_days: 90
  min_interval_hours: 24
  vacuum_after_prune: true

# Security settings
security:
  redact_secrets: true
