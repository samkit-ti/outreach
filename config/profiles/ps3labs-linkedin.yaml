# =============================================================================
# Profile: ps3labs-linkedin (LinkedIn)
# =============================================================================
model:
  provider: azure-foundry
  base_url: ${AZURE_FOUNDRY_BASE_URL}
  api_mode: chat_completions
  auth_mode: api_key
  default: ${DEFAULT_MODEL:-Kimi-K2.6}
  context_length: 128000
  api_key: ${AZURE_FOUNDRY_API_KEY}

gateway:
  platforms:
    telegram:
      token_env: TELEGRAM_BOT_TOKEN
      allowed_users: "*"
      unauthorized_dm_behavior: ignore
      reply_to_mode: first
      reply_prefix: "💼 [LinkedIn]: "
      
    discord:
      token_env: DISCORD_BOT_TOKEN
      allowed_users:
        - "${FOUNDER_DISCORD_ID}"
      dm_only: true

display:
  tool_progress: new
  busy_ack_enabled: true
  busy_ack_detail: false
  platforms:
    telegram:
      tool_progress: off
      busy_ack_detail: false

cron:
  jobs:
    - name: linkedin_post_morning
      schedule: "0 9 * * 1,3,5"
      command: "python -m skills.social_media create-post --platform linkedin --profile ps3labs"
    
    - name: linkedin_post_afternoon
      schedule: "0 15 * * 2,4"
      command: "python -m skills.social_media create-post --platform linkedin --profile ps3labs"
    
    - name: linkedin_engagement_check
      schedule: "0 */3 * * *"
      command: "python -m skills.social_media engagement --platform linkedin --profile ps3labs"
    
    - name: linkedin_message_responses
      schedule: "0 11,17 * * *"
      command: "python -m skills.social_media respond-messages --platform linkedin --profile ps3labs"
    
    - name: linkedin_connection_requests
      schedule: "0 12 * * 1,3,5"
      command: "python -m skills.social_media send-connections --platform linkedin --profile ps3labs"
    
    - name: git_sync
      schedule: "0 2 * * *"
      command: "bash /app/scripts/git-sync.sh"

skills:
  paths:
    - /app/skills
    - /app/active-skills

web:
  backend: ${WEB_SEARCH_BACKEND:-duckduckgo}
  search_backend: ${WEB_SEARCH_BACKEND:-duckduckgo}

auxiliary:
  vision:
    provider: azure-foundry
    model: Kimi-K2.6
    base_url: ${AZURE_FOUNDRY_BASE_URL}
    api_key: ${AZURE_FOUNDRY_API_KEY}
  
  web_extract:
    provider: azure-foundry
    model: Kimi-K2.6
    base_url: ${AZURE_FOUNDRY_BASE_URL}
    api_key: ${AZURE_FOUNDRY_API_KEY}

sessions:
  auto_prune: true
  retention_days: 90
  min_interval_hours: 24
  vacuum_after_prune: true

security:
  redact_secrets: true

# Profile metadata
profile:
  name: ps3labs-linkedin
  platform: linkedin
  brand_voice: "Professional, insightful, industry-leading. Shares thought leadership on AI in education, company milestones, and industry trends."
  target_audience: "EdTech professionals, school administrators, AI researchers, investors"
  posting_strategy: "3-4 posts/week. Long-form thought leadership, company updates, industry commentary."
